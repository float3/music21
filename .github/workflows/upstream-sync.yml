# Opens a pull request when cuthbertLab/music21 has commits this fork lacks.
#
# This fork carries fixes of its own on master, several of them sent upstream
# as pull requests, so it drifts behind and has to be caught up by hand every
# so often. This does the catching up: once a day it looks at upstream, and
# where upstream is ahead it opens one pull request asking to merge
# **`cuthbertLab/music21:master` into this fork's `master`**.
#
# The pull request is that, and nothing in between: no branch of this fork's
# own is pushed, nothing is force-pushed, and nothing has to be cleaned up
# afterwards. It also keeps itself current -- as upstream advances, the same
# pull request grows, because its head *is* upstream's branch.
#
# **It never asks anything of upstream.** The pull request's base is this
# fork, so merging it changes nothing there, and the guard below pins the job
# to this repository by name: were this file ever to reach
# cuthbertLab/music21 -- by a pull request from a branch cut off this master,
# say -- it must do nothing at all.
#
# Keep it off any branch sent upstream for that same reason. Cut a
# contribution's branch from `upstream/master` rather than from this master
# and neither this file nor anything else of the fork's appears in its diff.
name: Upstream sync

on:
  schedule:
    # Daily, a little after the hour so as not to pile onto the scheduler's
    # busiest minute. GitHub disables scheduled workflows in a repository with
    # no activity for sixty days; a run of this one does not count as
    # activity, so if it goes quiet, push something or run it by hand from the
    # Actions tab.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: >-
          The branch this fork wants caught up, and the branch the pull
          request asks to merge into. `master` is what the daily run takes;
          another is for trying this workflow out, since the path that
          matters -- opening the pull request -- is skipped whenever there is
          nothing to take, which is most days.
        required: false
        default: master

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Open a pull request from upstream into this fork
    runs-on: ubuntu-latest
    if: github.repository == 'float3/music21'
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v7
        with:
          # The whole history: whether upstream merges cleanly is read off the
          # commits either side, which a shallow clone has not got.
          fetch-depth: 0
          ref: ${{ inputs.base || 'master' }}

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/cuthbertLab/music21.git
          git fetch --no-tags upstream master

      - name: Say what is new, and whether it merges
        id: survey
        run: |
          set -euo pipefail
          behind="$(git rev-list --count HEAD..upstream/master)"
          ahead="$(git rev-list --count upstream/master..HEAD)"
          {
            echo "behind=$behind"
            echo "ahead=$ahead"
            echo "head=$(git rev-parse --short upstream/master)"
            echo "base=${{ inputs.base || 'master' }}"
          } >> "$GITHUB_OUTPUT"

          if [ "$behind" -eq 0 ]; then
            echo "Already up to date with upstream; nothing to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Whether it merges is worked out here and only *said* in the body:
          # `git merge-tree` tries the merge without a working tree and
          # without writing anything, and names the paths that clash. Nothing
          # is committed, nothing is pushed.
          if git merge-tree --write-tree --name-only HEAD upstream/master > /tmp/merged.txt; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            # Its output is the merged tree's name, then the clashing
            # paths, then a blank line and the running commentary -- so the
            # paths are the lines after the first and before the blank, and
            # not, as read the first time, the ones after it.
            awk 'NR > 1 { if (NF == 0) exit; print }' /tmp/merged.txt > /tmp/conflicts.txt
          fi

          {
            echo "$behind upstream commits to take; this fork is $ahead ahead."
            echo
            git log --oneline --no-decorate HEAD..upstream/master | head -40
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: steps.survey.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.survey.outputs.behind }}
          AHEAD: ${{ steps.survey.outputs.ahead }}
          UPSTREAM_HEAD: ${{ steps.survey.outputs.head }}
          CLEAN: ${{ steps.survey.outputs.clean }}
          BASE: ${{ steps.survey.outputs.base }}
        run: |
          set -euo pipefail
          {
            echo "\`cuthbertLab/music21\` has **$BEHIND** commits this fork does not, and this fork is $AHEAD ahead of it. Upstream is at \`$UPSTREAM_HEAD\`."
            echo
            echo "The head of this pull request *is* upstream's \`master\`, so it keeps itself current: as upstream advances this grows, rather than going stale."
            echo
            if [ "$CLEAN" = "true" ]; then
              echo "It merges **cleanly**. Check the fork's own fixes still do what they were written to do before merging -- a test file that merges without complaint is not a test that passes."
            else
              echo "It **conflicts**. Settle these by hand:"
              echo
              while read -r path; do [ -n "$path" ] && echo "- \`$path\`"; done < /tmp/conflicts.txt
              echo
              echo "A conflict here is usually one of this fork's fixes meeting an upstream change to the same lines. Where upstream has taken an equivalent fix, prefer upstream's; where the fork's change still stands on its own, keep the fork's and say so in the merge."
            fi
            echo
            echo "**Merge it, never squash it.** Squashing would flatten upstream's commits into one and lose their authorship."
            echo
            echo "Opened by \`.github/workflows/upstream-sync.yml\`, which runs daily."
          } > /tmp/body.md

          title="Take $BEHIND commits from upstream music21"
          # One pull request, found by what it is rather than by a branch name
          # of ours: its head is `master` in `cuthbertLab`.
          existing="$(gh pr list --base "$BASE" --state open \
            --json number,headRefName,headRepositoryOwner \
            --jq '.[] | select(.headRefName == "master" and .headRepositoryOwner.login == "cuthbertLab") | .number' \
            | head -1)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file /tmp/body.md
            echo "Updated #$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # `GITHUB_TOKEN` may only open a pull request where **Settings ->
          # Actions -> General -> Workflow permissions -> "Allow GitHub
          # Actions to create and approve pull requests"** is ticked; where it
          # is not, GitHub answers `Resource not accessible by integration`,
          # which says nothing about what to do. Naming the setting is what
          # makes that answer actionable. The run fails rather than going
          # quietly green: a sync that opened nothing has not done its job.
          if gh pr create --base "$BASE" --head cuthbertLab:master \
              --title "$title" --body-file /tmp/body.md
          then
            echo "Opened a pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE}...cuthbertLab:master?expand=1"
          {
            echo "### Nothing was opened"
            echo
            echo "Upstream has $BEHIND commits to take, and opening the pull request was refused."
            echo
            echo "Tick **Settings -> Actions -> General -> Workflow permissions -> \"Allow GitHub Actions to create and approve pull requests\"** and the next run will open it. Until then, [open it by hand]($compare)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Cannot open the pull request::Upstream has $BEHIND commits to take. Tick Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests, or open it by hand: $compare"
          exit 1
